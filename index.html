<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>キャラクター画像ランダム生成</title>
    <!-- ZIPを作成するためのライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <h1>キャラクター画像ジェネレーター</h1>
    <!-- 指定されたサイズ (w1178 x h1650) -->
    <canvas id="myCanvas" width="1178" height="1650" style="border:1px solid #000; max-width: 100%; height: auto;"></canvas>
    <br>
    <button onclick="downloadAllZips()" style="padding: 15px 30px; font-size: 1.2em;">全480枚を6つのZIPで一括保存</button>
    
    <script>
        async function downloadAllZips() {
            const canvas = document.getElementById('myCanvas');
            const ctx = canvas.getContext('2d');

            const counts = {
                hair: 10,
                base: 1,
                dress: 8,
                bang: 6,
                face: 9,
                glass: 2  // glass0.png と glass1.png
            };

            const totalZips = 6;
            const itemsPerZip = 80;

            // --- 1. すべての組み合わせ（480通り）を作る ---
            let allTrios = [];
            for (let h = 1; h <= counts.hair; h++) {
                for (let d = 1; d <= counts.dress; d++) {
                    for (let bg = 1; bg <= counts.bang; bg++) {
                        allTrios.push({ h, d, bg });
                    }
                }
            }

            // --- 2. ドレス（dress）の偏りを防ぐためのグループ分け ---
            let dressGroups = {};
            for (let d = 1; d <= counts.dress; d++) {
                dressGroups[d] = allTrios.filter(trio => trio.d === d);
                dressGroups[d].sort(() => Math.random() - 0.5); // グループ内をシャッフル
            }

            // 6つのZIPそれぞれに、各ドレスが均等に割り振られるように配分する
            let zipBuckets = Array.from({ length: totalZips }, () => []);

            for (let i = 0; i < totalZips; i++) {
                for (let d = 1; d <= counts.dress; d++) {
                    const takeCount = itemsPerZip / counts.dress; // 80 ÷ 8 = 各ドレス10枚ずつ
                    const items = dressGroups[d].splice(0, takeCount);
                    zipBuckets[i].push(...items);
                }
                // ZIPごとの中でも順番が偏らないようにシャッフル
                zipBuckets[i].sort(() => Math.random() - 0.5);
            }

            // --- 3. 6つのZIPファイルを順に生成してダウンロード ---
            for (let zipIndex = 0; zipIndex < totalZips; zipIndex++) {
                const zip = new JSZip();
                const selectedTrios = zipBuckets[zipIndex];
                let count = 0;

                for (const trio of selectedTrios) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // face（1 〜 9）をランダムに選択
                    const f = Math.floor(Math.random() * counts.face) + 1;

                    // glassの確率調整（70%の確率で 0 / 30%の確率で 1）
                    const glassWeights = { 0: 70, 1: 30 };
                    const rand = Math.random() * (glassWeights[0] + glassWeights[1]);
                    let g = (rand < glassWeights[0]) ? 0 : 1;

                    const sources = [
                        `img/hair/hair${trio.h}.png`,
                        `img/base/base.png`,
                        `img/dress/dress${trio.d}.png`,
                        `img/bang/bang${trio.bg}.png`,
                        `img/face/face${f}.png`
                    ];

                    if (g !== 0) {
                        sources.push(`img/glass/glass${g}.png`);
                    }

                    // 画像の読み込みと描画
                    for (const src of sources) {
                        try {
                            const img = await loadImage(src);
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        } catch (e) {
                            alert("エラー: 以下の画像が見つかりません\n" + src);
                            return;
                        }
                    }

                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                    count++;
                    zip.file(`character_${count}.png`, blob);
                }

                // ZIPをダウンロード
                const content = await zip.generateAsync({ type: "blob" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(content);
                link.download = `characters_part_${zipIndex + 1}.zip`;
                
                // ブラウザの連続ダウンロードブロックを防ぐため、少し間隔をあけて実行
                await new Promise(resolve => setTimeout(resolve, 600 * zipIndex));
                link.click();
            }

            alert(`全480枚の処理が完了しました！6つのZIPファイルが順番にダウンロードされます。`);
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = (e) => reject(new Error("Failed to load: " + src));
                img.src = src;
            });
        }
    </script>
</body>
</html>
