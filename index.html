<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>キャラクター画像ランダム生成</title>
    <!-- ZIPを作成するためのライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <h1>キャラクター画像ジェネレーター</h1>
    <!-- 指定されたサイズ (w1178 x h1650) -->
    <canvas id="myCanvas" width="1178" height="1650" style="border:1px solid #000; max-width: 100%; height: auto;"></canvas>
    <br>
    <button onclick="downloadAll480()" style="padding: 15px 30px; font-size: 1.2em;">保存</button>
    
    <script>
        async function downloadAll480() {
            const canvas = document.getElementById('myCanvas');
            const ctx = canvas.getContext('2d');
            const zip = new JSZip();

            const counts = {
                hair: 10,
                base: 1,
                dress: 8,
                bang: 6,
                face: 9,
                glass: 2
            };

            let allCombinations = [];

            for (let h = 1; h <= counts.hair; h++) {
                for (let b = 1; b <= counts.base; b++) {
                    for (let d = 1; d <= counts.dress; d++) {
                        for (let bg = 1; bg <= counts.bang; bg++) {
                            for (let f = 1; f <= counts.face; f++) {
                                for (let g = 0; g < counts.glass; g++) {
                                    allCombinations.push({ h, b, d, bg, f, g });
                                }
                            }
                        }
                    }
                }
            }

            let count = 0;
            for (const combo of allCombinations) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const sources = [
                    `img/hair/hair${combo.h}.png`,
                    `img/base/base.png`,
                    `img/dress/dress${combo.d}.png`,
                    `img/bang/bang${combo.bg}.png`,
                    `img/face/face${combo.f}.png`
                ];

                if (combo.g !== 0) {
                    sources.push(`img/glass/glass${combo.g}.png`);
                }

                for (const src of sources) {
                    try {
                        const img = await loadImage(src);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    } catch (e) {
                        // どの画像パスの読み込みに失敗したか具体的にアラート表示します
                        alert("エラー: 以下の画像が見つかりません\n" + src);
                        return;
                    }
                }

                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                count++;
                zip.file(`character_${count}.png`, blob);
                break; 
            }

            const content = await zip.generateAsync({ type: "blob" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(content);
            link.download = `test_character.zip`;
            link.click();

            alert(`テスト出力が完了しました！`);
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = (e) => reject(new Error("Failed to load: " + src));
                img.src = src;
            });
        }
    </script>
</body>
</html>
