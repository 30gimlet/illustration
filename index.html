<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>キャラクター画像ランダム生成</title>
    <!-- ZIPを作成するためのライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <h1>キャラクター画像ジェネレーター</h1>
    <!-- 指定されたサイズに変更 (w1178 x h1650) -->
    <canvas id="myCanvas" width="1178" height="1650" style="border:1px solid #000; max-width: 100%; height: auto;"></canvas>
    <br>
    <button onclick="downloadRandomSubset()" style="padding: 15px 30px; font-size: 1.2em;">全480枚を6つのZIPで一括保存</button>
    <script src="script.js"></script>
</body>
</html>
