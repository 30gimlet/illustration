<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>キャラクター画像ランダム生成</title>
    <!-- ZIPを作成するためのライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <h1>キャラクター画像ジェネレーター</h1>
    <!-- 指定されたサイズ (w1178 x h1650) -->
    <canvas id="myCanvas" width="1178" height="1650" style="border:1px solid #000; max-width: 100%; height: auto;"></canvas>
    <br>
    <button onclick="downloadAll480()" style="padding: 15px 30px; font-size: 1.2em;">全480枚を1つのZIPで一括保存</button>
    
    <script>
        async function downloadAll480() {
            const canvas = document.getElementById('myCanvas');
            const ctx = canvas.getContext('2d');
            const zip = new JSZip();

            const counts = {
                hair: 10,
                base: 1,
                dress: 8,
                bang: 6,
                face: 9,
                glass: 2  // glass0.png と glass1.png
            };

            // --- 1. すべての組み合わせ（480通り）を作る ---
            let allTrios = [];
            for (let h = 1; h <= counts.hair; h++) {
                for (let d = 1; d <= counts.dress; d++) {
                    for (let bg = 1; bg <= counts.bang; bg++) {
                        allTrios.push({ h, d, bg });
                    }
                }
            }

            // 全体の順番をランダムにシャッフル
            allTrios.sort(() => Math.random() - 0.5);

            let count = 0;
            // --- 2. 480枚すべてを順番に描画してZIPに詰める ---
            for (const trio of allTrios) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // face（1 〜 9）をランダムに選択
                const f = Math.floor(Math.random() * counts.face) + 1;

                // glassの確率調整（70%の確率で 0 / 30%の確率で 1）
                const glassWeights = { 0: 70, 1: 30 };
                const rand = Math.random() * (glassWeights[0] + glassWeights[1]);
                let g = (rand < glassWeights[0]) ? 0 : 1;

                const sources = [
                    `img/hair/hair${trio.h}.png`,
                    `img/base/base.png`,
                    `img/dress/dress${trio.d}.png`,
                    `img/bang/bang${trio.bg}.png`,
                    `img/face/face${f}.png`
                ];

                if (g !== 0) {
                    sources.push(`img/glass/glass${g}.png`);
                }

                // 画像の読み込みと描画
                for (const src of sources) {
                    try {
                        const img = await loadImage(src);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    } catch (e) {
                        alert("エラー: 以下の画像が見つかりません\n" + src);
                        return;
                    }
                }

                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                count++;
                zip.file(`character_${count}.png`, blob);
            }

            // --- 3. 1つのZIPとしてダウンロード ---
            alert(`480枚の描画が完了しました！ZIPファイルを生成してダウンロードします（少し時間がかかります）。`);
            
            const content = await zip.generateAsync({ type: "blob" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(content);
            link.download = `all_480_characters.zip`;
            link.click();
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = (e) => reject(new Error("Failed to load: " + src));
                img.src = src;
            });
        }
    </script>
</body>
</html>
